services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_REQUIRE_CLIENT_AUTH_SCHEME: "sasl"
      ZOOKEEPER_AUTH_PROVIDER_1: "org.apache.zookeeper.server.auth.SASLAuthenticationProvider"
      ZOOKEEPER_SASL_ENABLED: "true"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/zookeeper/zookeeper_server_jaas.conf"

    volumes:
      - ./secrets/zookeeper/zookeeper_server_jaas.conf:/etc/zookeeper/zookeeper_server_jaas.conf

    networks:
      pnet:

  broker1:
    image: confluentinc/cp-server:7.4.0
    hostname: kafka.local
    container_name: broker1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
      - "9993:9993"
      - "9994:9994"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:SSL,SASL_SSL:SASL_SSL
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9993,SASL_SSL://:9994
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:29092,EXTERNAL://kafka.local:9993,SASL_SSL://kafka.local:9994
    env_file:
      - env.broker  # Подключаем общие переменные
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "broker1:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - ./secrets/broker1:/etc/kafka/jaas
      - ./secrets/broker1/kafka.server.truststore.jks:/etc/kafka/secrets/kafka.server.truststore.jks
      - ./secrets/broker1/kafka.server.keystore.jks:/etc/kafka/secrets/kafka.server.keystore.jks
      - ./secrets/broker1/ssl_key_credentials:/etc/kafka/secrets/ssl_key_credentials
      - ./secrets/broker1/ssl_keystore_credentials:/etc/kafka/secrets/ssl_keystore_credentials
      - ./secrets/broker1/ssl_truststore_credentials:/etc/kafka/secrets/ssl_truststore_credentials
      - .//secrets/broker1/client.properties:/tmp/client.conf
    networks:
      pnet:
        ipv4_address: 192.168.0.100


  topics-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: topics-init
    depends_on:
      broker1:
        condition: service_healthy
    restart: on-failure
    networks:
      pnet:
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...';
        sleep 5;
        
        # Создаем топики
        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic products_in --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic products --partitions 1 --replication-factor 1;

        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic block --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic block-table --partitions 1 --replication-factor 1 --config cleanup.policy=compact;
        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic user-actions --partitions 1 --replication-factor 1;

        echo 'Topics created successfully!';
        exit 0;
      "
networks:
  pnet:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24