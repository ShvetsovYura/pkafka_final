services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # ZOOKEEPER_REQUIRE_CLIENT_AUTH_SCHEME: "sasl"
      # ZOOKEEPER_AUTH_PROVIDER_1: "org.apache.zookeeper.server.auth.SASLAuthenticationProvider"
      # ZOOKEEPER_SASL_ENABLED: "true"
      # KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/zookeeper/zookeeper_server_jaas.conf"

    # volumes:
    #   - ./zookeeper/zookeeper_server_jaas.conf:/etc/zookeeper/zookeeper_server_jaas.conf

    networks:
      pnet:

  broker1:
    image: confluentinc/cp-server:7.4.0
    hostname: kafka.local
    container_name: broker1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:SSL #,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9993 #,SASL_PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:29092,EXTERNAL://kafka.local:9993 #,SASL_PLAINTEXT://broker1:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # sasl
      # KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      # KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SASL_SSL
      # KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/jaas/kafka_server_jaas.conf"

      # ssl
      KAFKA_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/kafka.server.keystore.jks"
      KAFKA_SSL_KEYSTORE_PASSWORD: 12345678
      KAFKA_SSL_KEY_PASSWORD: 12345678
      KAFKA_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/kafka.server.truststore.jks"
      KAFKA_SSL_TRUSTSTORE_PASSWORD: 12345678
      # KAFKA_SSL_CLIENT_AUTH: "required"  # Для mTLS
    

      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker1:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: 'true'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "broker1:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      # - ./broker:/etc/kafka/jaas
      - ./secrets:/etc/kafka/secrets
      - ./client/client.properties:/tmp/client.conf
    extra_hosts:
      - "kafka.local:192.168.1.100"
    networks:
      pnet:
        ipv4_address: 192.168.0.100



  topics-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: topics-init
    depends_on:
      broker1:
        condition: service_healthy
    restart: on-failure
    networks:
      pnet:
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...';
        sleep 5;
        
        # Создаем топики
        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic products_in --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic products --partitions 1 --replication-factor 1;

        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic block --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic block-table --partitions 1 --replication-factor 1 --config cleanup.policy=compact;
        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic user-actions --partitions 1 --replication-factor 1;

        echo 'Topics created successfully!';
        exit 0;
      "
networks:
  pnet:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24