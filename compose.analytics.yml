services:
  ub:
    image: ubuntu:22.04
    container_name: ub
    hostname: ub
    networks:
      - pnet
  hadoop-namenode:
    image: apache/hadoop:3.4.1
    container_name: hadoop-namenode
    hostname: hadoop-namenode
    user: "root"
    restart: always
    platform: linux/amd64
    deploy:
      resources:
        limits:
          cpus: "1.0" # Ограничение использования CPU
          memory: "1g" # Ограничение использования RAM
    shm_size: 10G
    ports:
      - "9870:9870" # HTTP-порт для Web UI HDFS NameNode
      - "9000:9000" # RPC порт для запросов к NameNode
    volumes:
      - ./configs/hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./configs/hdfs/hdfs-site-namenode.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./namenode_entrypoint.sh:/namenode_entrypoint.sh
    entrypoint: [ "/bin/bash", "/namenode_entrypoint.sh" ]
    command: [ "hdfs", "namenode" ]

  hadoop-datanode-1:
    image: apache/hadoop:3.4.1
    container_name: hadoop-datanode-1
    hostname: hadoop-datanode-1
    user: "root"
    restart: always
    platform: linux/amd64
    deploy:
      resources:
        limits:
          cpus: "1.0" # Ограничение использования CPU
          memory: "1g" # Ограничение использования RAM
    shm_size: 10G
    depends_on:
      - hadoop-namenode
    ports:
      - "9864:9864" # HTTP-порт для Web UI DataNode №1
      - "9970:9970" # RPC порт для запросов от NameNode
    volumes:
      - ./configs/hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./configs/hdfs/hdfs-site-datanode-1.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./datanode_entrypoint.sh:/datanode_entrypoint.sh
    entrypoint: [ "/bin/bash", "/datanode_entrypoint.sh" ]
    command: [ "hdfs", "datanode" ]

  spark:
   image: docker.io/bitnami/spark:3.5
   environment:
     - SPARK_MODE=master
     - SPARK_RPC_AUTHENTICATION_ENABLED=no
     - SPARK_RPC_ENCRYPTION_ENABLED=no
     - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
     - SPARK_SSL_ENABLED=no
     - SPARK_USER=spark
   ports:
     - '8080:8080'
     - '15002:15002'


  spark-worker:
   image: docker.io/bitnami/spark:3.5
   environment:
     - SPARK_MODE=worker
     - SPARK_MASTER_URL=spark://spark:7077
     - SPARK_WORKER_MEMORY=1G
     - SPARK_WORKER_CORES=1
     - SPARK_RPC_AUTHENTICATION_ENABLED=no
     - SPARK_RPC_ENCRYPTION_ENABLED=no
     - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
     - SPARK_SSL_ENABLED=no
     - SPARK_USER=spark

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  spark-data:
